---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Test local GitHub Action"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: '@18d9c4446bea555d0783e850f6d295f844fe8f67'  # v0.1.1

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Passing fixtures: five tests, one skipped, no failures.
      - name: "Report passing fixtures"
        id: pass
        uses: ./
        with:
          report-paths: "tests/reports/pass/*.xml"
          artifact-name: "junit-pass-fixtures"

      - name: "Validate passing result"
        shell: bash
        env:
          TOTAL: ${{ steps.pass.outputs.total }}
          PASSED: ${{ steps.pass.outputs.passed }}
          FAILURES: ${{ steps.pass.outputs.failures }}
          ERRORS: ${{ steps.pass.outputs.errors }}
          SKIPPED: ${{ steps.pass.outputs.skipped }}
          RESULT: ${{ steps.pass.outputs.result }}
          REPORT_COUNT: ${{ steps.pass.outputs.report_count }}
          ARTIFACT_NAME: ${{ steps.pass.outputs.artifact_name }}
        run: |
          # Validate passing result
          set -euo pipefail
          errors=0
          check() {
            if [ "$2" != "$3" ]; then
              echo "Error: $1 expected '$3' but got '$2' ❌"
              errors=1
            else
              echo "OK: $1 = $2 ✅"
            fi
          }
          check "total" "$TOTAL" "5"
          check "passed" "$PASSED" "4"
          check "failures" "$FAILURES" "0"
          check "errors" "$ERRORS" "0"
          check "skipped" "$SKIPPED" "1"
          check "result" "$RESULT" "success"
          check "report_count" "$REPORT_COUNT" "2"
          check "artifact_name" "$ARTIFACT_NAME" "junit-pass-fixtures"
          exit "$errors"

      # No matching reports: the action stays neutral rather than failing.
      # Leave artifact-upload at its default (true) so the neutral path
      # exercises the artifact_name contract: with no reports the upload is
      # skipped and artifact_name must be empty.
      - name: "Report with no matching files"
        id: none
        uses: ./
        with:
          report-paths: "tests/reports/does-not-exist/*.xml"

      - name: "Validate neutral result"
        shell: bash
        env:
          RESULT: ${{ steps.none.outputs.result }}
          TOTAL: ${{ steps.none.outputs.total }}
          REPORT_COUNT: ${{ steps.none.outputs.report_count }}
          ARTIFACT_NAME: ${{ steps.none.outputs.artifact_name }}
        run: |
          # Validate neutral result
          set -euo pipefail
          if [ "$RESULT" != "none" ] || [ "$TOTAL" != "0" ] \
             || [ "$REPORT_COUNT" != "0" ]; then
            echo "Error: expected neutral result with zero counts ❌"
            exit 1
          fi
          if [ -n "$ARTIFACT_NAME" ]; then
            echo "Error: artifact_name must be empty with no reports ❌"
            exit 1
          fi
          echo "Neutral result validated ✅"

      # Failing fixtures with fail-on-failure must set the step to failed.
      - name: "Report failing fixtures"
        id: fail
        continue-on-error: true
        uses: ./
        with:
          report-paths: "tests/reports/fail/*.xml"
          artifact-upload: "false"
          fail-on-failure: "true"

      - name: "Validate failing result"
        shell: bash
        env:
          OUTCOME: ${{ steps.fail.outcome }}
          FAILURES: ${{ steps.fail.outputs.failures }}
          ERRORS: ${{ steps.fail.outputs.errors }}
          RESULT: ${{ steps.fail.outputs.result }}
          ARTIFACT_NAME: ${{ steps.fail.outputs.artifact_name }}
        run: |
          # Validate failing result
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "Error: expected step outcome 'failure' but got '$OUTCOME' ❌"
            exit 1
          fi
          if [ "$FAILURES" != "1" ] || [ "$ERRORS" != "0" ] \
             || [ "$RESULT" != "failure" ]; then
            echo "Error: expected one failure, no errors, result 'failure' ❌"
            exit 1
          fi
          if [ -n "$ARTIFACT_NAME" ]; then
            echo "Error: artifact_name must be empty when upload is off ❌"
            exit 1
          fi
          echo "Failing result validated ✅"
