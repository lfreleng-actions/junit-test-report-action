# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Test local GitHub Action"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: '@18d9c4446bea555d0783e850f6d295f844fe8f67'  # v0.1.1

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Passing fixtures: five tests, one skipped, no failures.
      - name: "Report passing fixtures"
        id: pass
        uses: $/
        with:
          report-paths: "tests/reports/pass/*.xml"
          artifact-name: "junit-pass-fixtures"

      - name: "Validate passing result"
        shell: bash
        env:
          TOTAL: ${{ steps.pass.outputs.total }}
          PASSED: ${{ steps.pass.outputs.passed }}
          FAILURES: ${{ steps.pass.outputs.failures }}
          ERRORS: ${{ steps.pass.outputs.errors }}
          SKIPPED: ${{ steps.pass.outputs.skipped }}
          RESULT: ${{ steps.pass.outputs.result }}
          REPORT_COUNT: ${{ steps.pass.outputs.report_count }}
          ARTIFACT_NAME: ${{ steps.pass.outputs.artifact_name }}
        run: |
          # Validate passing result
          set -euo pipefail
          errors=0
          check() {
            if [ "$2" != "$3" ]; then
              echo "Error: $1 expected '$3' but got '$2' ❌"
              errors=1
            else
              echo "OK: $1 = $2 ✅"
            fi
          }
          check "total" "$TOTAL" "5"
          check "passed" "$PASSED" "4"
          check "failures" "$FAILURES" "0"
          check "errors" "$ERRORS" "0"
          check "skipped" "$SKIPPED" "1"
          check "result" "$RESULT" "success"
          check "report_count" "$REPORT_COUNT" "2"
          check "artifact_name" "$ARTIFACT_NAME" "junit-pass-fixtures"
          exit "$errors"

      # No matching reports: the action stays neutral rather than failing.
      # Leave artifact-upload at its default (true) so the neutral path
      # exercises the artifact_name contract: with no reports the upload is
      # skipped and artifact_name must be empty.
      - name: "Report with no matching files"
        id: none
        uses: $/
        with:
          report-paths: "tests/reports/does-not-exist/*.xml"

      - name: "Validate neutral result"
        shell: bash
        env:
          RESULT: ${{ steps.none.outputs.result }}
          TOTAL: ${{ steps.none.outputs.total }}
          REPORT_COUNT: ${{ steps.none.outputs.report_count }}
          ARTIFACT_NAME: ${{ steps.none.outputs.artifact_name }}
        run: |
          # Validate neutral result
          set -euo pipefail
          if [ "$RESULT" != "none" ] || [ "$TOTAL" != "0" ] \
             || [ "$REPORT_COUNT" != "0" ]; then
            echo "Error: expected neutral result with zero counts ❌"
            exit 1
          fi
          if [ -n "$ARTIFACT_NAME" ]; then
            echo "Error: artifact_name must be empty with no reports ❌"
            exit 1
          fi
          echo "Neutral result validated ✅"

      # Failing fixtures with fail-on-failure must set the step to failed.
      - name: "Report failing fixtures"
        id: fail
        continue-on-error: true
        uses: $/
        with:
          report-paths: "tests/reports/fail/*.xml"
          artifact-upload: "false"
          fail-on-failure: "true"

      - name: "Validate failing result"
        shell: bash
        env:
          OUTCOME: ${{ steps.fail.outcome }}
          FAILURES: ${{ steps.fail.outputs.failures }}
          ERRORS: ${{ steps.fail.outputs.errors }}
          RESULT: ${{ steps.fail.outputs.result }}
          ARTIFACT_NAME: ${{ steps.fail.outputs.artifact_name }}
        run: |
          # Validate failing result
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "Error: expected step outcome 'failure' but got '$OUTCOME' ❌"
            exit 1
          fi
          if [ "$FAILURES" != "1" ] || [ "$ERRORS" != "0" ] \
             || [ "$RESULT" != "failure" ]; then
            echo "Error: expected one failure, no errors, result 'failure' ❌"
            exit 1
          fi
          if [ -n "$ARTIFACT_NAME" ]; then
            echo "Error: artifact_name must be empty when upload is off ❌"
            exit 1
          fi
          echo "Failing result validated ✅"

  ### Count reports from other JUnit producers ###
  parsing:
    name: "Parse ${{ matrix.fixture }} reports"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # node --test --test-reporter=junit: top-level test() cases sit
          # outside any <testsuite>, and describe blocks nest suites.
          - fixture: "node"
            total: "5"
            passed: "3"
            failures: "1"
            errors: "0"
            skipped: "1"
            time: "0.002"
          # jest-junit: one flat suite per test file.
          - fixture: "jest"
            total: "5"
            passed: "3"
            failures: "1"
            errors: "0"
            skipped: "1"
            time: "0.187"
          # vitest --reporter=junit: one flat suite per test file.
          - fixture: "vitest"
            total: "5"
            passed: "3"
            failures: "1"
            errors: "0"
            skipped: "1"
            time: "0.008"
          # Hand-written: CDATA, comments and a DOCTYPE quoting markup,
          # attribute values quoting attributes, missing attributes,
          # nested suites, count-only and wrapper-only files.
          - fixture: "edge"
            total: "14"
            passed: "8"
            failures: "2"
            errors: "2"
            skipped: "2"
            time: "4.000"
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22  # v0.12.2
        with:
          config: '@18d9c4446bea555d0783e850f6d295f844fe8f67'  # v0.1.1

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Report ${{ matrix.fixture }} fixtures"
        id: report
        uses: $/
        with:
          report-paths: "tests/reports/${{ matrix.fixture }}/*.xml"
          artifact-upload: "false"

      - name: "Validate ${{ matrix.fixture }} result"
        shell: bash
        env:
          TOTAL: ${{ steps.report.outputs.total }}
          PASSED: ${{ steps.report.outputs.passed }}
          FAILURES: ${{ steps.report.outputs.failures }}
          ERRORS: ${{ steps.report.outputs.errors }}
          SKIPPED: ${{ steps.report.outputs.skipped }}
          TIME: ${{ steps.report.outputs.time }}
          RESULT: ${{ steps.report.outputs.result }}
          WANT_TOTAL: ${{ matrix.total }}
          WANT_PASSED: ${{ matrix.passed }}
          WANT_FAILURES: ${{ matrix.failures }}
          WANT_ERRORS: ${{ matrix.errors }}
          WANT_SKIPPED: ${{ matrix.skipped }}
          WANT_TIME: ${{ matrix.time }}
        run: |
          # Validate parsed counts
          set -euo pipefail
          errors=0
          check() {
            if [ "$2" != "$3" ]; then
              echo "Error: $1 expected '$3' but got '$2' ❌"
              errors=1
            else
              echo "OK: $1 = $2 ✅"
            fi
          }
          check "total" "$TOTAL" "$WANT_TOTAL"
          check "passed" "$PASSED" "$WANT_PASSED"
          check "failures" "$FAILURES" "$WANT_FAILURES"
          check "errors" "$ERRORS" "$WANT_ERRORS"
          check "skipped" "$SKIPPED" "$WANT_SKIPPED"
          check "time" "$TIME" "$WANT_TIME"
          check "result" "$RESULT" "failure"
          exit "$errors"
